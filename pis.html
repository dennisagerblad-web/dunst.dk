<head>

<body>
  <main class="pis-page"><a class="pis-link" href="index.html" id="pis-back">Pis<br>mig<br>i<br>num<br>-sen</a></main>
  <script>
    document.getElementById("pis-back").addEventListener("click", (event) => {
      const previous = document.referrer ? new URL(document.referrer) : null;
      if (previous?.origin === location.origin && previous.pathname !== location.pathname) {
        event.preventDefault();
        history.back();
      }
    });
  </script>
</body>
