<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forside | dunst</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #fff url("../0/images/fade_op.jpg") repeat-x top left;
      color: #111;
      font-family: Verdana, Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 116px 0 48px;
    }
    h1 {
      margin: 0 0 20px;
      color: #111;
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.15;
    }
    .post {
      border: 2px solid #ff00ff;
      background: #fff;
    }
    .post h2 {
      margin: 0;
      padding: 12px 16px;
      background: #ffffcc;
      font-size: clamp(17px, 2.5vw, 22px);
      line-height: 1.35;
    }
    .post-body { padding: 16px; }
    .video {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      display: block;
      background: #000;
    }
    .video-link { margin: 12px 0 0; font-size: 13px; line-height: 1.5; }
    a { color: #a000a0; }
    a:focus-visible { outline: 3px solid #000; outline-offset: 3px; }
    @media (max-width: 540px) {
      main { width: min(100% - 20px, 760px); padding-top: 110px; }
      .post-body { padding: 10px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>På forsiden</h1>
    <section aria-label="Indslag">
      <article class="post">
        <h2>Copenhagen Performance Art Troupe – Dunst</h2>
        <div class="post-body">
          <iframe class="video" src="https://www.youtube-nocookie.com/embed/ESgo8ApK9IY" title="Copenhagen Performance Art Troupe – Dunst på YouTube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          <p class="video-link"><a href="https://www.youtube.com/watch?v=ESgo8ApK9IY" target="_blank" rel="noopener noreferrer">Se videoen på YouTube</a></p>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
