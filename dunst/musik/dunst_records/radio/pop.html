<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8 />
<title>Sample Flash Music Player Embed Code</title>
</head>
<body bgcolor="#333300">

<!--
INSTRUCTIONS
* Change autoPlay to "yes" if you want the music track to start automatically once loaded

More instructions at:
http://www.premiumbeat.com/flash_resources/free_flash_music_player/multiple_tracks_mp3_player_menu.php

-->

<!-- Begin Copy/Paste -->
<strong><font color="#FFFF00">dunst Records Remix-CD 1</font></strong><br />
<script type="text/javascript" src="swfobject.js"></script>
		
<div id="flashPlayer">
  This text will be replaced by the flash music player.
</div>

<script type="text/javascript">
   var so = new SWFObject("playerMultipleList.swf", "mymovie", "295", "200", "7", "#333300");  
   so.addVariable("autoPlay","yes")
   so.addVariable("playlistPath","playlist.xml")
   so.write("flashPlayer");
</script>

<!-- End Copy/Paste -->

</body>
</html>
